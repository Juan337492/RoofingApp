# One canonical host: send www to the bare domain so search engines see a single copy of each page.
server {
    listen 8080;
    listen [::]:8080;
    server_name www.dynamicroofingandconstruction.us;
    return 301 https://dynamicroofingandconstruction.us$request_uri;
}

server {
    listen 8080 default_server;
    listen [::]:8080 default_server;
    server_name _;
    root /usr/share/nginx/html;

    gzip on;
    gzip_types text/css application/javascript application/json application/xml image/svg+xml;
    gzip_min_length 1024;

    # Redirects keep the internal port off absolute URLs
    absolute_redirect off;

    # Content-hashed bundles and assets never change
    location ~ ^/(_expo|assets)/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Each route is pre-rendered to its own .html file
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri.html $uri/index.html =404;
    }

    error_page 404 /+not-found.html;
}
